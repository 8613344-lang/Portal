plugins { id 'com.android.application' }
android {
    namespace 'ru.portal.books'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.portal.books'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        storeRelease {
            if (System.getenv('RUSTORE_KEYSTORE')) {
                storeFile file(System.getenv('RUSTORE_KEYSTORE'))
                storePassword System.getenv('RUSTORE_STORE_PASSWORD')
                keyAlias System.getenv('RUSTORE_KEY_ALIAS')
                keyPassword System.getenv('RUSTORE_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release {
        minifyEnabled false
        if (System.getenv('RUSTORE_KEYSTORE')) signingConfig signingConfigs.storeRelease
    } }
}
