{% load static %}
{% if request.resolver_match.url_name != 'install' %}
<aside class="install-offer" data-install-offer hidden aria-label="Добавить сайт на главный экран">
  <img src="{% static 'pwa/icon-192.png' %}" alt="" width="48" height="48">
  <div><strong>Ваши книги — под рукой</strong><p>Добавьте ярлык на телефон или планшет.</p><a href="{% url 'install' %}" data-install-trigger>Как добавить <span aria-hidden="true">↗</span></a></div>
  <button type="button" data-install-dismiss aria-label="Скрыть предложение на неделю">×</button>
</aside>
{% endif %}
<div class="mobile-nav-dock"><nav class="mobile-nav" aria-label="Быстрая навигация">
  <a href="{% url 'home' %}"{% if request.resolver_match.url_name == 'home' %} aria-current="page"{% endif %}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H4V10M9 20v-7h6v7"/></svg><span>Главная</span></a>
  <a href="{% url 'web-shelf' %}"{% if request.resolver_match.url_name == 'web-shelf' %} aria-current="page"{% endif %}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h5v16H3zM8 4h5v16H8zM15 5l4-1 3 15-4 1zM3 16h10"/></svg><span>Мои книги</span></a>
  <a href="{% url 'order' %}"{% if request.resolver_match.url_name == 'order' %} aria-current="page"{% endif %}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18"/></svg><span>Создать</span></a>
  <a href="{% if user.is_authenticated %}{% url 'profile' %}{% else %}{% url 'login' %}{% endif %}"{% if request.resolver_match.url_name == 'profile' or request.resolver_match.url_name == 'login' %} aria-current="page"{% endif %}><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span>{% if user.is_authenticated %}Профиль{% else %}Войти{% endif %}</span></a>
</nav></div>
