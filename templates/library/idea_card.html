{% load static web_images %}
<article class="concept-card concept-{{ item.theme }}">
  <a class="concept-cover" href="{% url 'order' %}">
    {% if item.image %}<img src="{% web_image item.image 640 %}" srcset="{% web_image item.image 320 %} 320w, {% web_image item.image 640 %} 640w" sizes="(max-width: 700px) 90vw, 360px" decoding="async" loading="lazy" alt="Идея книги: {{ item.title }}">
    {% elif item.default_image == 'space' %}<img src="{% static 'images/web/space-640.webp' %}" srcset="{% static 'images/web/space-320.webp' %} 320w, {% static 'images/web/space-640.webp' %} 640w" sizes="(max-width: 700px) 90vw, 360px" width="640" height="853" decoding="async" loading="lazy" alt="Идея книги: {{ item.title }}">
    {% elif item.default_image == 'forest' %}<img src="{% static 'images/web/forest-640.webp' %}" srcset="{% static 'images/web/forest-320.webp' %} 320w, {% static 'images/web/forest-640.webp' %} 640w" sizes="(max-width: 700px) 90vw, 360px" width="640" height="853" decoding="async" loading="lazy" alt="Идея книги: {{ item.title }}">
    {% else %}<img src="{% static 'images/web/hero-480.webp' %}" width="480" height="320" decoding="async" loading="lazy" alt="Идея книги: {{ item.title }}">{% endif %}
    <span class="concept-cover-title">{{ item.title }}</span>
  </a>
  <div class="concept-body"><span class="concept-tag">Идея для вашей книги</span><h3>{{ item.title }}</h3><p>{{ item.description }}</p><a href="{% url 'order' %}">Создать похожую историю <span aria-hidden="true">↗</span></a></div>
</article>
