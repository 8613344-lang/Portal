<section class="attached-videos{% if not attached_videos %} is-empty{% endif %}" aria-label="Дополнительные видео книги">{% for item in attached_videos %}<article><div><p class="eyebrow">ВИДЕО К ИСТОРИИ</p><h2>{{ item.title }}</h2>{% if item.description %}<p>{{ item.description }}</p>{% endif %}</div><video controls playsinline preload="metadata" src="{% url 'hidden-video-file' item.share_token %}" data-attached-video></video><a class="text-link" href="{% url 'hidden-video' item.share_token %}" target="_blank" rel="noopener">Открыть видео отдельно ↗</a></article>{% endfor %}</section>
