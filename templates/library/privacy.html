{% extends 'base.html' %}
{% block title %}{{ agreement.title }} · Книги рядом{% endblock %}
{% block content %}
<article class="legal section">
  <p class="eyebrow">ДОКУМЕНТЫ САЙТА</p>
  <h1 class="page-title">{{ agreement.title }}</h1>
  {% if agreement.updated_at %}<p class="muted legal-updated">Обновлено: <time datetime="{{ agreement.updated_at|date:'c' }}">{{ agreement.updated_at|date:'d.m.Y' }}</time></p>{% endif %}
  <div class="legal-body">{{ agreement.content|linebreaks }}</div>
</article>
{% endblock %}
