{% if page_obj.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Страницы каталога">{% if page_obj.has_previous %}<a href="?q={{ query|urlencode }}&page={{ page_obj.previous_page_number }}">← Назад</a>{% endif %}<span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?q={{ query|urlencode }}&page={{ page_obj.next_page_number }}">Далее →</a>{% endif %}</nav>{% endif %}
