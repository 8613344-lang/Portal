<article class="book-card"><a class="card-cover" href="{% url 'reader' book.slug %}">{% if book.cover %}<img src="{{ book.cover.url }}" alt="Обложка: {{ book.title }}" loading="lazy">{% else %}<div class="cover-placeholder"><span>✦</span><strong>{{ book.title }}</strong><small>КНИГИ РЯДОМ</small></div>{% endif %}<span class="card-open">Читать ↗</span></a><p class="card-meta">{{ book.age_label }}</p><h3><a href="{% url 'reader' book.slug %}">{{ book.title }}</a></h3><p class="card-description">{{ book.description|truncatechars:130 }}</p></article>
