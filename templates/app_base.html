{% load static %}<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Мои книги{% endblock %}</title><link rel="stylesheet" href="{% static 'style.css' %}"><link rel="stylesheet" href="{% static 'android.css' %}"><script src="{% static 'reader.js' %}" defer></script></head>
<body class="app-shell device-{{ device }}"><header class="app-header site-header"><a class="brand" href="{% url 'app-shelf' %}?device={{ device }}">▤ Мои книги</a><nav>{% if user.is_authenticated %}<span>{{ user.username }}</span><form action="{% url 'app-logout' %}?device={{ device }}" method="post">{% csrf_token %}<button class="text-link">Выйти</button></form>{% else %}<a class="button secondary" href="{% url 'app-login' %}?device={{ device }}">Войти</a>{% endif %}</nav></header>
<main>{% block content %}{% endblock %}</main></body></html>
